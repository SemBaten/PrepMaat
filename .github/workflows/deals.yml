name: Aanbiedingen ophalen
# Haalt elke nacht de supermarktaanbiedingen op (bron: PrijsProfeet) en zet ze in deals.json
on:
  schedule:
    - cron: "15 4 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 tools/fetch-deals.py deals.json
      - name: Opslaan als er iets veranderd is
        run: |
          git config user.name "prepmaat-bot"
          git config user.email "prepmaat-bot@users.noreply.github.com"
          git add deals.json
          git diff --cached --quiet || (git commit -m "Aanbiedingen bijgewerkt" && git push)
