<style>
/* Layout: one phone column, bottom tab bar, full-screen sheets for recipe and cook mode */
:root {
  --bg: #eef2ee;
  --surface: #ffffff;
  --sunk: #e3e9e4;
  --ink: #17211c;
  --muted: #5a6b62;
  --line: #d3ddd6;
  --accent: #23664a;
  --accent-ink: #ffffff;
  --accent-soft: #d8ebe0;
  --protein: #9a6a00;
  --protein-soft: #fbedc6;
  --warn: #a3401f;
  --display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body: "Inter", -apple-system, "Segoe UI", system-ui, sans-serif;
  --r: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101512; --surface: #19211c; --sunk: #222c26; --ink: #e5ede8; --muted: #9aaca2;
    --line: #2d3a33; --accent: #6cc597; --accent-ink: #0d1a13; --accent-soft: #1f3a2c;
    --protein: #f0c45c; --protein-soft: #3a2f12; --warn: #f08a65; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #101512; --surface: #19211c; --sunk: #222c26; --ink: #e5ede8; --muted: #9aaca2;
  --line: #2d3a33; --accent: #6cc597; --accent-ink: #0d1a13; --accent-soft: #1f3a2c;
  --protein: #f0c45c; --protein-soft: #3a2f12; --warn: #f08a65; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { background: var(--bg); }
body { color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.5; -webkit-text-size-adjust: 100%; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--display); line-height: 1.15; text-wrap: balance; margin: 0; }
.num { font-variant-numeric: tabular-nums; }

.wrap { max-width: 620px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 110px; display: grid; gap: 22px; }
.top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brand { font-family: var(--display); font-weight: 800; font-size: 30px; letter-spacing: -0.02em; }
.brand span { color: var(--accent); }
.sub { color: var(--muted); font-size: 14px; }

.section { display: grid; gap: 10px; }
.label { font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: grid; gap: 12px; min-width: 0; }
.hero { background: var(--accent); color: var(--accent-ink); border: 0; }
.hero .label, .hero .meta { color: inherit; opacity: 0.85; }
.hero h2 { font-size: 26px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.between { justify-content: space-between; }
.meta { color: var(--muted); font-size: 14px; display: flex; gap: 12px; flex-wrap: wrap; }

.pill { display: inline-flex; align-items: center; gap: 4px; font-size: 13px; font-weight: 600; padding: 3px 9px; border-radius: 999px; background: var(--sunk); color: var(--ink); white-space: nowrap; }
.pill.p { background: var(--protein-soft); color: var(--protein); }
.hero .pill { background: rgba(255,255,255,0.18); color: inherit; }
.hero .pill.p { background: var(--protein-soft); color: var(--protein); }

.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 9px 14px; font-weight: 600; font-size: 15px; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.hero .btn { background: var(--accent-ink); color: var(--accent); border-color: transparent; }
.hero .btn.ghost { background: transparent; color: var(--accent-ink); border-color: rgba(255,255,255,0.5); }
:root[data-theme="dark"] .hero .btn.ghost { border-color: rgba(0,0,0,0.35); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .hero .btn.ghost { border-color: rgba(0,0,0,0.35); } }
.btn.small { padding: 6px 10px; font-size: 14px; }
.btn.full { width: 100%; padding: 13px; font-size: 16px; }

.days { display: grid; gap: 0; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.day { display: grid; grid-template-columns: 44px 1fr auto; gap: 10px; align-items: center; padding: 11px 12px; border-top: 1px solid var(--line); }
.day:first-child { border-top: 0; }
.day.today { background: var(--accent-soft); }
.dname { font-family: var(--display); font-weight: 800; font-size: 15px; }
.dmeal { min-width: 0; text-align: left; background: none; border: 0; padding: 0; }
.dmeal b { display: block; font-weight: 600; line-height: 1.3; }
.dmeal small { color: var(--muted); font-size: 13px; }
.off { color: var(--muted); font-style: italic; }
.dact { display: flex; gap: 6px; }
.prow { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; padding: 11px 12px; border-top: 1px solid var(--line); }
.prow:first-child { border-top: 0; }
.prow .stepper span { min-width: 64px; font-size: 14px; }
.pkrow { display: grid; grid-template-columns: 1fr auto 44px; gap: 8px; align-items: center; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 8px 8px 8px 12px; }
.pkrow.on { border-color: var(--accent); background: var(--accent-soft); }
.addbtn { width: 44px; height: 44px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--accent); font-size: 24px; font-weight: 600; }
.insp { gap: 8px; }
.storeh { font-size: 19px; margin: 14px 0 0; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.inote { font-size: 13px; color: var(--muted); }
.group { font-size: 20px; margin: 18px 0 -4px; }
.fbtext { min-height: 120px; resize: vertical; font: inherit; line-height: 1.4; }
.nudge { border-color: var(--accent); }
.stars.big { gap: 8px; }
.stars.big button { width: 52px; height: 52px; font-size: 28px; }
.linkbtn { background: none; border: 0; padding: 4px 0; color: var(--accent); font-weight: 600; font-size: 14px; text-decoration: underline; text-underline-offset: 3px; text-align: left; }
.wform { display: grid; grid-template-columns: 1fr auto auto; gap: 8px; align-items: center; }
.wform input { min-width: 0; }
.wchart { margin: 0; display: grid; gap: 6px; }
.wchart svg { width: 100%; height: auto; touch-action: pan-y; }
.wgrid { stroke: var(--line); stroke-width: 1; }
.wtick { fill: var(--muted); font-size: 11px; }
.wdot { fill: var(--accent); opacity: .45; }
.wdot.on { opacity: 1; stroke: var(--surface); stroke-width: 2; }
.wline { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.wcross { stroke: var(--muted); stroke-width: 1; stroke-dasharray: 3 3; }
.iwhere { font-size: 13px; color: var(--muted); }
.ztip { font-size: 13px; color: var(--muted); margin: -2px 0 6px; }
.havebtn { display: inline-block; margin-top: 6px; font-size: 13px; font-weight: 600; color: var(--accent); border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px; }
.homebtn { display: grid; gap: 2px; text-align: left; justify-items: start; border-color: var(--accent); }
.hrow { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 10px 12px; }
.hrow.yes { background: var(--accent-soft); border-color: var(--accent); }
.hrow.no { opacity: .75; }
.hbtns { display: flex; gap: 6px; }
.havelist { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.havelist li { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.inote.miss { color: var(--warn); }

.stepper { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--surface); }
.stepper button { border: 0; background: none; width: 38px; height: 36px; font-size: 20px; font-weight: 600; color: var(--accent); }
.stepper span { min-width: 30px; text-align: center; font-weight: 600; }

.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line); background: var(--surface); padding: 7px 14px; border-radius: 999px; font-weight: 600; font-size: 14px; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }

.rlist { display: grid; gap: 10px; }
.rcard { text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; display: grid; gap: 6px; }
.rcard h3 { font-size: 18px; }
.rcard p { margin: 0; color: var(--muted); font-size: 14px; }

.shop { display: grid; gap: 18px; }
.cat { display: grid; gap: 6px; }
.item { display: grid; grid-template-columns: 28px 1fr; gap: 10px; align-items: start; padding: 10px 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; text-align: left; width: 100%; }
.box { width: 24px; height: 24px; border-radius: 7px; border: 2px solid var(--line); display: grid; place-items: center; margin-top: 1px; }
.item.done { opacity: 0.5; }
.item.done .box { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.item.done .iname { text-decoration: line-through; }
.iname { font-weight: 600; }
.ihint { font-size: 13px; color: var(--muted); }
.addrow { display: flex; gap: 8px; }
.addrow input { flex: 1; min-width: 0; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; background: var(--surface); color: var(--ink); font: inherit; }

.prose { display: grid; gap: 10px; }
.prose p { margin: 0; }
.spoons { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.spoon { background: var(--sunk); border-radius: 10px; padding: 12px; }
.spoon b { font-family: var(--display); font-size: 22px; display: block; }
.heat { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.heat div { border-radius: 8px; padding: 8px 6px; text-align: center; font-size: 13px; background: var(--sunk); }
.heat b { display: block; font-size: 15px; }
.field { display: grid; gap: 6px; }
.field input { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; background: var(--surface); color: var(--ink); font: inherit; width: 120px; }

.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
.tabs nav { max-width: 620px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); }
.tabs button { background: none; border: 0; padding: 10px 2px 12px; display: grid; justify-items: center; gap: 2px; font-size: 11px; letter-spacing: -0.01em; font-weight: 600; color: var(--muted); }
.tabs button svg { width: 24px; height: 24px; }
.tabs button[aria-current="page"] { color: var(--accent); }
.badge { position: absolute; top: -4px; left: 16px; background: var(--accent); color: var(--accent-ink); border-radius: 999px; font-size: 10px; line-height: 16px; min-width: 16px; padding: 0 4px; text-align: center; }
.ticon { position: relative; display: block; height: 24px; }

.sheet { position: fixed; inset: 0; z-index: 40; background: var(--bg); overflow-y: auto; -webkit-overflow-scrolling: touch; padding-top: env(safe-area-inset-top, 0px); }
.sheet .wrap { padding-block: 12px 60px; }
.sheethead { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.back { background: none; border: 0; color: var(--accent); font-weight: 600; padding: 8px 0; font-size: 16px; }
.dtitle { font-size: 30px; letter-spacing: -0.01em; }
.macros { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.macro { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px; text-align: center; }
.macro b { font-family: var(--display); font-size: 24px; display: block; line-height: 1.1; }
.macro.p { background: var(--protein-soft); border-color: transparent; color: var(--protein); }
.macro small { font-size: 12px; color: var(--muted); }
.macro.p small { color: inherit; }
.ings { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.ings li { border-top: 1px solid var(--line); }
.ings li:first-child { border-top: 0; }
.ings button { width: 100%; text-align: left; background: none; border: 0; padding: 10px 14px; display: flex; gap: 10px; align-items: baseline; }
.ings .amt { font-weight: 600; min-width: 92px; font-variant-numeric: tabular-nums; }
.ings .got { opacity: 0.45; text-decoration: line-through; }
.steps { margin: 0; padding: 0; list-style: none; display: grid; gap: 10px; counter-reset: s; }
.steps li { counter-increment: s; display: grid; grid-template-columns: 30px 1fr; gap: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
.steps li::before { content: counter(s); font-family: var(--display); font-weight: 800; color: var(--accent); font-size: 20px; }
.steps .t { font-size: 13px; color: var(--muted); margin-top: 4px; }
.qty { font-weight: 700; background: var(--accent-soft); border-radius: 5px; padding: 0 4px; box-decoration-break: clone; -webkit-box-decoration-break: clone; }
.tip { background: var(--protein-soft); color: var(--ink); border-radius: 12px; padding: 12px 14px; font-size: 15px; }

.cook { display: grid; grid-template-rows: auto 1fr auto; min-height: 100%; }
.cook .wrap { min-height: calc(100dvh - env(safe-area-inset-top, 0px)); grid-template-rows: auto auto 1fr auto; }
.progress { height: 6px; border-radius: 99px; background: var(--sunk); overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--accent); }
.cstep { font-size: 22px; line-height: 1.45; align-self: start; }
.cstep .qty { font-size: 22px; }
.timer { display: grid; gap: 10px; justify-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; }
.timer b { font-family: var(--display); font-size: 48px; font-variant-numeric: tabular-nums; line-height: 1; }
.timer.ring { background: var(--protein-soft); border-color: var(--protein); animation: pulse 0.8s ease-in-out infinite alternate; }
@keyframes pulse { to { transform: scale(1.02); } }
@media (prefers-reduced-motion: reduce) { .timer.ring { animation: none; } }
.cnav { display: grid; grid-template-columns: 1fr 2fr; gap: 10px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(84px + env(safe-area-inset-bottom, 0px)); z-index: 60; background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-weight: 600; font-size: 14px; max-width: calc(100% - 32px); text-align: center; }
.empty { color: var(--muted); text-align: center; padding: 20px; }
.pill.star { background: var(--protein-soft); color: var(--protein); }
.select { border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; background: var(--surface); color: var(--ink); font: inherit; font-size: 15px; }
.rcard.nofit { opacity: 0.55; }
.chip.no[aria-pressed="true"] { background: var(--warn); border-color: var(--warn); color: var(--surface); }
.cat .sub { font-size: 13px; }
.rate { display: grid; gap: 8px; }
.stars { display: flex; gap: 4px; }
.stars button { width: 44px; height: 44px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); font-size: 22px; color: var(--line); line-height: 1; }
.stars button.zero { font-size: 16px; font-weight: 700; color: var(--muted); }
.stars button.on { color: var(--protein); background: var(--protein-soft); border-color: var(--protein); }
.stars button.zero.on { color: var(--warn); background: var(--surface); border-color: var(--warn); }
.macros { grid-template-columns: repeat(3, 1fr); }
.pill.fo { background: var(--accent-soft); color: var(--accent); }
.pill.warnp { background: transparent; border: 1px solid var(--warn); color: var(--warn); }
.gbar { display: grid; gap: 4px; font-size: 15px; }
.goals { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.goals div { background: var(--sunk); border-radius: 10px; padding: 10px; text-align: center; }
.goals b { font-family: var(--display); font-size: 22px; display: block; line-height: 1.1; }
.goals small { font-size: 12px; color: var(--muted); }
.check { display: flex; gap: 10px; align-items: center; font-size: 15px; }
.check input { width: 22px; height: 22px; accent-color: var(--accent); flex: none; }
.pfgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.pfgrid .field input { width: 100%; min-width: 0; }
.pfgrid .row { flex-wrap: nowrap; }
.opts { display: grid; gap: 8px; }
.opt { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 12px 14px; display: grid; gap: 2px; }
.opt span { font-size: 14px; color: var(--muted); }
.opt[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); box-shadow: inset 0 0 0 1px var(--accent); }
.pgrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.popt { border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 8px 4px; display: grid; gap: 1px; text-align: center; min-width: 0; }
.popt b { font-size: 14px; }
.popt span { font-size: 12px; color: var(--muted); }
.popt.adv { border-style: dashed; border-color: var(--protein); }
.popt[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); border-style: solid; color: var(--accent-ink); }
.popt[aria-pressed="true"] span { color: var(--accent-ink); opacity: 0.85; }
.opt.multi[aria-pressed="true"] b::before { content: "✓ "; }
.search { width: 100%; border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; background: var(--surface); color: var(--ink); font: inherit; font-size: 16px; }
.fold > summary { cursor: pointer; list-style: none; display: flex; align-items: center; gap: 8px; }
.fold > summary::-webkit-details-marker { display: none; }
.fold > summary::after { content: "▾"; margin-left: auto; color: var(--muted); transition: transform .15s; }
.fold[open] > summary::after { transform: rotate(180deg); }
details.fold.card { gap: 14px; }
details.fold.card:not([open]) { gap: 0; }
.quicklog { display: flex; flex-wrap: wrap; gap: 8px; }
.quicklog .btn { display: inline-flex; gap: 8px; align-items: baseline; }
.loglist { list-style: none; margin: 0; padding: 0; display: grid; border-top: 1px solid var(--line); }
.loglist li { display: grid; grid-template-columns: 1fr auto 36px; gap: 8px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 15px; }
.loglist .x { border: 0; background: none; font-size: 22px; color: var(--muted); height: 36px; }
.flist { display: grid; gap: 6px; }
.frow { display: grid; grid-template-columns: 1fr auto 28px; gap: 8px; align-items: center; text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 10px 12px; }
.frow .plus { color: var(--accent); font-size: 22px; text-align: center; }
.cookings { margin-top: 14px; font-size: 16px; }
@media (max-width: 380px) { .frow { grid-template-columns: 1fr 28px; } .frow .sub { grid-column: 1; } .loglist li { grid-template-columns: 1fr 36px; } .loglist li .sub { grid-column: 1; } }
.ph-big { width: 100%; border-radius: 12px; display: block; }
.photo-btn { text-align: center; display: block; }
.vh { position: absolute; width: 1px; height: 1px; opacity: 0; overflow: hidden; clip: rect(0 0 0 0); }
.phgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.phgrid figure { margin: 0; position: relative; }
.phgrid img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 10px; display: block; }
.phgrid figcaption { position: absolute; left: 6px; bottom: 6px; font-size: 11px; font-weight: 600; background: var(--surface); color: var(--ink); padding: 1px 6px; border-radius: 6px; }
.stars-ro { color: var(--protein); letter-spacing: 1px; }
.stars-ro .dim { color: var(--line); }
</style>
</head>
<body>
<div id="app"></div>
<div id="sheet" class="sheet" hidden></div>
<div id="toast" class="toast" hidden></div>
<div class="tabs"><nav id="tabs"></nav></div>

<script>

function shopDone(){
  const items = shopItems(); S.stock = S.stock || {}; const left = [];
  for (const it of items){
    if (it.extra !== undefined || !KEEP.includes(it.id)) continue;
    const d = DB[it.id], st = S.stock[it.id] || 0;
    let avail = st;
    if (S.atHome && S.atHome[it.id]) avail = Math.max(avail, it.q);
    else if (S.checks[it.id] && d.pk && it.need > 0.01) avail += Math.max(1, Math.ceil(it.need / d.pk[0] - 0.15)) * d.pk[0];
    const rest = Math.max(0, avail - it.q);
    if (rest >= (d.u === "g" ? 40 : 1)){ S.stock[it.id] = rest; left.push(amountOnly(it.id, rest) + " " + ingName(it.id)); } else delete S.stock[it.id];
  }
  S.checks = {}; S.atHome = {};
  return left;
}
function myStores(){ return STORES.map(x => x[0]).filter(k => (S.stores || []).includes(k)); }
function hasAt(k, st){ return !(MISS[k] || []).includes(st); }
function shopItems(){
  const tot = {};
  const add = (r, f) => { for (const [k, q] of r.items) tot[k] = (tot[k] || 0) + q * f; };
  S.plan.lunch.forEach(x => { const r = RID[x.id]; if (r) add(r, x.n / r.serves * pf(r)); });
  S.plan.diner.forEach(x => { const r = RID[x.id]; if (r) add(r, x.n * (S.persons - 1 + pf(r)) / r.serves); });
  (S.plan.ontbijt || []).forEach(x => { const r = RID[x.id]; if (r) add(r, x.n * pf(r) / r.serves); });
  const items = [];
  for (const [k, q] of Object.entries(tot)){
    const d = DB[k]; if (d.c === "water") continue;
    const st = (S.stock && S.stock[k]) || 0, need = Math.max(0, q - st);
    const b = buyText(k, need > 0 ? need : q);
    let have = false, why = "";
    if (isPantry(k) && S.have && S.have[k]){ have = true; why = "Heb ik in huis"; }
    else if (st && need < 0.01){ have = true; why = `Nog over: ${amountOnly(k, st)}`; }
    else if (S.atHome && S.atHome[k]){ have = true; why = "Thuis gecheckt"; }
    if (st && need > 0.01 && !have) b.sub += ` (je had nog ${amountOnly(k, st)})`;
    items.push({ id: k, c: d.c, z: zoneOf(k), q, need, label: b.title, pack: b.pack || "", amt: "", hint: b.sub, where: WHERE[k] || "", pantry: isPantry(k), have, why, note: "" });
  }
  S.extras.forEach((t, i) => items.push({ id: "x" + i + ":" + t, c: "extra", z: "extra", label: t, amt: "", hint: "", note: "", extra: i }));
  const sel = myStores();
  if (!sel.length) return items;
  const cheap = [...sel].sort((a, b) => SRANK[a] - SRANK[b]);
  let primary = cheap[0];
  if (S.shopMode !== "goedkoop"){ let best = -1; for (const st of cheap){ const c = items.filter(it => it.extra !== undefined || hasAt(it.id, st)).length; if (c > best){ best = c; primary = st; } } }
  const names = sel.map(x => SNAME[x]).join(" of ").replace(/ of (?=.* of )/g, ", ");
  for (const it of items){
    if (it.extra !== undefined){ it.store = primary; continue; }
    const ok = (S.shopMode === "goedkoop" ? cheap : [primary, ...cheap]).find(st => hasAt(it.id, st));
    if (ok){ it.store = ok; if (ok !== primary && S.shopMode !== "goedkoop") it.note = `Meestal niet bij ${SNAME[primary]}, wel bij ${SNAME[ok]}.`; }
    else { it.store = primary; it.miss = true; it.note = `Vaak niet te koop bij ${names}.` + (SUB[it.id] ? ` Neem in plaats daarvan: ${SUB[it.id]}.` : ""); }
  }
  return items;
}
function shopStores(items){ const used = [...new Set(items.map(it => it.store).filter(Boolean))]; return used.sort((a, b) => (items.filter(i => i.store === b).length - items.filter(i => i.store === a).length)); }
function shopCount(){ return shopItems().filter(it => !S.checks[it.id] && !it.have).length; }
function listAsText(){
  const items = shopItems(), stores = shopStores(items), lines = ["Boodschappen (Prepmaat)"];
  const block = (arr) => { for (const [z, label] of ZONES){ const g = arr.filter(it => it.z === z && !S.checks[it.id] && !it.have); if (!g.length) continue; lines.push("", label.toUpperCase());
    for (const it of g) lines.push("- " + it.label + (it.pack ? " (" + it.pack + ")" : "") + (it.miss && SUB[it.id] ? " [of: " + SUB[it.id] + "]" : "")); } };
  if (stores.length > 1) stores.forEach(st => { lines.push("", "=== " + SNAME[st].toUpperCase() + " ==="); block(items.filter(it => it.store === st)); });
  else block(items);
  return lines.join("\n");
}

function wTime(d){ return new Date(d + "T12:00:00").getTime(); }
function weightStats(){
  const w = S.weights || []; if (!w.length) return null;
  const now = wTime(w[w.length - 1].d);
  const win = (a, b) => w.filter(e => { const t = wTime(e.d); return t > now - b * 864e5 && t <= now - a * 864e5; });
  const m = a => a.reduce((x, e) => x + e.kg, 0) / a.length;
  const cur = win(0, 7), prev = win(7, 14);
  return { last: w[w.length - 1], avg: m(cur), diff: prev.length ? m(cur) - m(prev) : null };
}
function saveWeight(kg){
  S.weights = (S.weights || []).filter(e => e.d !== dayKey());
  S.weights.push({ d: dayKey(), kg }); S.weights.sort((a, b) => a.d < b.d ? -1 : 1);
  if (S.weights.length > 400) S.weights = S.weights.slice(-400);
  const st = weightStats();
  if (S.profile) S.profile.weight = Math.round(st.avg * 10) / 10;
  save();
}
const MND = ["jan","feb","mrt","apr","mei","jun","jul","aug","sep","okt","nov","dec"];
function dLabel(d){ const x = new Date(d + "T12:00:00"); return x.getDate() + " " + MND[x.getMonth()]; }
function weightChart(){
  const w = (S.weights || []).slice(-60); if (w.length < 2) return `<p class="sub" style="margin:0">Na twee wegingen zie je hier een grafiek.</p>`;
  const W = 340, H = 130, L = 36, Rr = 10, T = 10, B = 22;
  const xs = w.map(e => wTime(e.d)), x0 = xs[0], x1 = xs[xs.length - 1];
  const vals = w.map(e => e.kg); let lo = Math.min(...vals), hi = Math.max(...vals);
  if (hi - lo < 2){ const mid = (hi + lo) / 2; lo = mid - 1; hi = mid + 1; }
  lo = Math.floor(lo * 2) / 2; hi = Math.ceil(hi * 2) / 2;
  const X = t => L + (x1 === x0 ? 0.5 : (t - x0) / (x1 - x0)) * (W - L - Rr), Y = v => T + (hi - v) / (hi - lo) * (H - T - B);
  const avg = w.map((e, i) => { const win = w.filter((f, j) => xs[j] <= xs[i] && xs[j] > xs[i] - 7 * 864e5); return win.reduce((a, f) => a + f.kg, 0) / win.length; });
  UI.wd = { w, xs, avg, X, Y, W };
  const ticks = [lo, (lo + hi) / 2, hi];
  return `<figure class="wchart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Gewicht over de laatste ${w.length} wegingen, van ${nl1(vals[0])} naar ${nl1(vals[vals.length - 1])} kg">
    ${ticks.map(v => `<line x1="${L}" x2="${W - Rr}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}" class="wgrid"/><text x="${L - 6}" y="${(Y(v) + 4).toFixed(1)}" text-anchor="end" class="wtick">${nl1(v)}</text>`).join("")}
    <text x="${L}" y="${H - 6}" class="wtick">${dLabel(w[0].d)}</text><text x="${W - Rr}" y="${H - 6}" text-anchor="end" class="wtick">${dLabel(w[w.length - 1].d)}</text>
    ${w.map((e, i) => `<circle cx="${X(xs[i]).toFixed(1)}" cy="${Y(e.kg).toFixed(1)}" r="3" class="wdot"/>`).join("")}
    <path d="${avg.map((v, i) => (i ? "L" : "M") + X(xs[i]).toFixed(1) + "," + Y(v).toFixed(1)).join("")}" class="wline"/>
    <g id="whover"></g>
    <rect x="${L}" y="0" width="${W - L - Rr}" height="${H - B}" fill="transparent" class="whit"/>
  </svg><figcaption class="sub num" id="wcap">Puntjes zijn je wegingen, de lijn is het gemiddelde van 7 dagen. Tik op de grafiek voor een dag.</figcaption></figure>`;
}
function weightHover(ev){
  const svg = ev.target.closest(".wchart svg"); if (!svg || !UI.wd) return;
  const { w, xs, avg, X, Y, W } = UI.wd, r = svg.getBoundingClientRect(), vx = (ev.clientX - r.left) / r.width * W;
  let bi = 0; xs.forEach((t, i) => { if (Math.abs(X(t) - vx) < Math.abs(X(xs[bi]) - vx)) bi = i; });
  const cx = X(xs[bi]).toFixed(1);
  document.getElementById("whover").innerHTML = `<line x1="${cx}" x2="${cx}" y1="8" y2="108" class="wcross"/><circle cx="${cx}" cy="${Y(w[bi].kg).toFixed(1)}" r="5" class="wdot on"/>`;
  document.getElementById("wcap").innerHTML = `<b>${dLabel(w[bi].d)}: ${nl1(w[bi].kg)} kg</b> · gemiddelde van 7 dagen ${nl1(avg[bi])} kg`;

function recipeMatches(){
  const f = S.filter, q = (UI.q || "").trim().toLowerCase();
  let list = R.filter(r => f === "alle" || r.type === f || (f === "gemaakt" && ratingsOf(r.id).length));
  if (q) list = list.filter(r => (r.name + " " + r.short + " " + cuisineName(r.cuisine) + " " + r.items.map(([k]) => DB[k].n).join(" ")).toLowerCase().includes(q));
  if (S.minStars) list = list.filter(r => (score(r.id) ?? 0) >= S.minStars);
  if (S.prefs.focus.length && S.focusFilter) list = list.filter(r => S.prefs.focus.every(k => focusMatch(r, k)));
  const fitting = list.filter(fits);
  const hidden = list.length - fitting.length;
  if (!S.showAll) list = fitting;
  if (S.sort === "sterren") list = [...list].sort((a, b) => (score(b.id) ?? -1) - (score(a.id) ?? -1));
  if (S.sort === "eiwit") list = [...list].sort((a, b) => pm(b).p - pm(a).p);
  if (S.sort === "kcal") list = [...list].sort((a, b) => pm(a).k - pm(b).k);
  if (S.sort === "tijd") list = [...list].sort((a, b) => a.time - b.time);
  return { list, hidden };
}

function closeSheet(){ UI.view = null; stopTimer(); releaseWake(); document.getElementById("sheet").hidden = true; document.documentElement.style.overflow = ""; UI.cook = null; render(); }

let wake = null;

function renderCook(){

  const r = RID[UI.open], f = factorFor(r), steps = allSteps(r, f), i = UI.cook, s = steps[i];
  const T = UI.timer;
  const timerHtml = s.min ? (() => {

    return `<div class="timer ${ring ? "ring" : ""}"><b id="tleft">${ring ? "Klaar!" : mmss(left)}</b>
      <div class="row">${ring ? `<button class="btn primary" id="tstop">Oké</button>` : `<button class="btn primary" id="tgo">${running ? "Pauze" : (T && T.step === i ? "Verder" : "Start timer")}</button>${T && T.step === i ? `<button class="btn" id="treset">Opnieuw</button>` : ""}`}</div></div>`;
  })() : "";
  document.getElementById("sheet").innerHTML = `<div class="wrap" style="min-height:calc(100dvh - env(safe-area-inset-top, 0px));grid-template-rows:auto auto 1fr auto auto">

    <div class="progress"><i style="width:${((i+1)/steps.length)*100}%"></i></div>
    <div class="cstep">${renderText(r, s.t, f)}${i === 0 ? `<ul class="ings cookings">${r.items.map(([k, q]) => `<li><button data-got="${k}" class="${UI.got[k] ? "got" : ""}"><span class="amt">${esc(amountOnly(k, q*f))}</span><span>${DB[k].u === "stuk" ? "" : esc(DB[k].n)}</span></button></li>`).join("")}</ul>` : ""}</div>
    ${timerHtml}
    <div class="cnav"><button class="btn full" id="prev" ${i === 0 ? "disabled" : ""}>Vorige</button><button class="btn primary full" id="next">${i === steps.length - 1 ? "Klaar! Geef sterren" : "Volgende stap"}</button></div>
  </div>`;
}
function mmss(sec){ sec = Math.max(0, sec); return `${Math.floor(sec/60)}:${String(sec%60).padStart(2,"0")}`; }
let tick = null, audioCtx = null;
function beep(){
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    for (let n = 0; n < 3; n++){ const o = audioCtx.createOscillator(), g = audioCtx.createGain(); o.frequency.value = 880; o.connect(g); g.connect(audioCtx.destination);
      const t0 = audioCtx.currentTime + n*0.4; g.gain.setValueAtTime(0.25, t0); g.gain.exponentialRampToValueAtTime(0.001, t0 + 0.3); o.start(t0); o.stop(t0 + 0.32); }
  } catch(e){}
  try { navigator.vibrate && navigator.vibrate([300,150,300]); } catch(e){}
}
function toggleTimer(){
  const r = RID[UI.open], s = allSteps(r, factorFor(r))[UI.cook];
  try { audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)(); audioCtx.resume && audioCtx.resume(); } catch(e){}
  if (!UI.timer || UI.timer.step !== UI.cook) UI.timer = { step: UI.cook, left: Math.round(s.min*60), running: false };
  UI.timer.running = !UI.timer.running;
  if (UI.timer.running){ UI.timer.end = Date.now() + UI.timer.left*1000; clearInterval(tick); tick = setInterval(onTick, 250); }
  else clearInterval(tick);
  renderCook();
}
function onTick(){
  const T = UI.timer; if (!T || !T.running) return;
  T.left = Math.round((T.end - Date.now())/1000);
  if (T.left <= 0){ T.left = 0; T.running = false; clearInterval(tick); beep(); if (UI.cook === T.step) renderCook(); else toast("Timer van stap " + (T.step+1) + " is klaar!"); return; }
  const el = document.getElementById("tleft"); if (el && UI.cook === T.step) el.textContent = mmss(T.left);
}
function stopTimer(){ clearInterval(tick); UI.timer = null; }

function toast(msg){ const t = document.getElementById("toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(() => t.hidden = true, 2200); }
async function copyText(text){
  try { await navigator.clipboard.writeText(text); toast("Lijst gekopieerd. Plak hem in WhatsApp of Notities."); }
  catch(e){ toast("Kopiëren lukt hier niet. Gebruik Delen."); }
}

/* ============ Acties ============ */
document.addEventListener("click", (e) => {
  const b = e.target.closest("[data-have], button, [data-delx]"); if (!b) return;
  const d = b.dataset;
  if (d.home){ const [k, v] = d.home.split(":"); UI.homeDone[k] = +v; S.atHome = S.atHome || {}; S.have = S.have || {};
    if (+v){ if (isPantry(k)) S.have[k] = true; else S.atHome[k] = true; } else { delete S.atHome[k]; if (isPantry(k)) delete S.have[k]; if (S.stock) delete S.stock[k]; }
    save(); renderHome(); render(); return; }
  if (d.unhave){ const k = d.unhave; if (S.have) delete S.have[k]; if (S.atHome) delete S.atHome[k]; if (S.stock) delete S.stock[k]; save(); render(); toast(DB[k].n + " staat weer op je lijst"); return; }
  if (d.have){ e.stopPropagation(); S.have = S.have || {}; const k = d.have; if (S.have[k]){ delete S.have[k]; toast(DB[k].n + " staat weer op je lijst"); } else { S.have[k] = true; toast(DB[k].n + " staat de volgende weken niet meer op je lijst"); } save(); render(); return; }
  if (d.delx !== undefined){ e.stopPropagation(); S.extras.splice(+d.delx, 1); save(); render(); return; }
  if (d.tab){ UI.filtersOpen = false; S.tab = d.tab; save(); render(); window.scrollTo(0, 0); return; }
  if (d.open){ openRecipe(d.open); return; }
  if (d.dellog !== undefined){ const k = dayKey(); S.log[k].splice(+d.dellog, 1); save(); render(); return; }
  if (d.addfood){ const [src, i] = d.addfood.split(":"); const x = (src === "m" ? S.myFoods : QUICK)[+i]; addLog({ n: x[0], k: x[1], p: x[2], v: x[3] || 0, gv: x[4] || 0, fr: x[5] || 0, src: "los" }); renderTracker(); toast(x[0] + " toegevoegd"); return; }
  if (d.focus){ const a = S.prefs.focus, i = a.indexOf(d.focus); i < 0 ? a.push(d.focus) : a.splice(i, 1); save(); if (S.tab === "recepten") UI.filtersOpen = true; render(); return; }
  if (d.sex){ UI.pfd.sex = d.sex; renderProfile(); return; }
  if (d.ext){ const i = d.ext.indexOf(":"), key = d.ext.slice(0, i), raw = d.ext.slice(i + 1), v = isNaN(+raw) ? raw : +raw; const E = UI.pfd.ext;
    if (E[key] === v) delete E[key]; else E[key] = v; UI.extOpen = true; renderProfile(); return; }
  if (d.tday !== undefined){ const a = UI.pfd.ext.trainDays, i = a.indexOf(+d.tday); i < 0 ? a.push(+d.tday) : a.splice(i, 1); renderProfile(); return; }
  if (d.diet){ UI.pfd.diet = d.diet; UI.extOpen = true; renderProfile(); return; }
  if (d.allergy){ const a = UI.pfd.allergies, i = a.indexOf(d.allergy); i < 0 ? a.push(d.allergy) : a.splice(i, 1); UI.extOpen = true; renderProfile(); return; }
  if (d.goal){ const a = UI.pfd.goals, i = a.indexOf(d.goal); i < 0 ? a.push(d.goal) : a.splice(i, 1); UI.pfd._goalChanged = true; renderProfile(); return; }
  if (d.appetite){ UI.pfd.appetite = d.appetite; renderProfile(); return; }
  if (d.portion){ S.portion = S.portion || {}; S.portion[UI.open] = d.portion; save(); renderRecipe(); render(); return; }
  if (d.act){ UI.pfd.activity = +d.act; renderProfile(); return; }
  if (d.minstars !== undefined){ S.minStars = +d.minstars; save(); UI.filtersOpen = true; render(); return; }
  if (d.rate){ const [k, n] = d.rate.split(":"); UI.rating[k] = +n; renderRating(); return; }
  if (d.meat){ S.prefs.meats[d.meat] = !S.prefs.meats[d.meat]; save(); render(); return; }
  if (d.spice !== undefined){ S.prefs.spice = +d.spice; save(); render(); return; }
  if (d.maxtime !== undefined){ S.prefs.maxTime = +d.maxtime; save(); render(); return; }
  if (d.cuisine){ const a = S.prefs.noCuisine, i = a.indexOf(d.cuisine); i < 0 ? a.push(d.cuisine) : a.splice(i, 1); save(); render(); return; }
  if (d.noing){ const a = S.prefs.noIng, i = a.indexOf(d.noing); i < 0 ? a.push(d.noing) : a.splice(i, 1); save(); render(); return; }
  if (d.filter){ S.filter = d.filter; UI.rmax = 40; save(); render(); return; }
  if (d.rmore){ UI.rmax = (UI.rmax || 40) + 40; document.getElementById("rlist").innerHTML = recipeListHtml(); document.getElementById("rmore").innerHTML = moreBtn(recipeMatches().list.length, UI.rmax, "data-rmore"); return; }
  if (d.pmore){ UI.pmax = (UI.pmax || 50) + 50; document.getElementById("plist").innerHTML = pickerList(); return; }
  if (d.check){ S.checks[d.check] = !S.checks[d.check]; save(); render(); return; }
  if (d.got){ UI.got[d.got] = !UI.got[d.got]; UI.view === "cook" ? renderCook() : renderRecipe(); return; }
  if (d.pick){ openPicker(d.pick); return; }
  if (d.basics){ openBasics(); return; }
  if (d.feedback){ openFeedback(); return; }
  if (d.fbscore){ UI.fb.score = UI.fb.score === +d.fbscore ? 0 : +d.fbscore; renderFeedback(); return; }
  if (d.fbabout){ UI.fb.about = d.fbabout; renderFeedback(); return; }
  if (d.addp){ const n = addToPlan(d.addp), r = RID[d.addp]; UI.clearArm = false; save(); render(); refreshSheet(); toast(`${r.name}: ${unitN(r.type, n)} in je week`); return; }
  if (d.pn){ const [id, dl] = d.pn.split(":"); setPlanN(id, +dl); save(); render(); refreshSheet(); return; }
  if (d.store){ if (S.tab === "lijst") UI.storesOpen = true; S.stores = S.stores || []; const i = S.stores.indexOf(d.store); i < 0 ? S.stores.push(d.store) : S.stores.splice(i, 1); save(); render(); return; }
  if (d.shopmode){ S.shopMode = d.shopmode; save(); render(); return; }
  if (d.logplan){ const r = RID[d.logplan], m = pm(r); addLog({ n: typeLabel(r).split(" ·")[0] + ": " + r.name, k: m.k, p: m.p, v: m.v, gv: m.gv, fr: m.fr, src: r.id }); render(); toast("Toegevoegd aan vandaag"); return; }
  if (d.ld){ S.lunchDays = Math.min(7, Math.max(1, S.lunchDays + +d.ld)); save(); if (UI.open && !document.getElementById("sheet").hidden) renderRecipe(); render(); return; }
  if (d.pp){ S.persons = Math.min(6, Math.max(1, S.persons + +d.pp)); save(); if (UI.open && !document.getElementById("sheet").hidden) renderRecipe(); render(); return; }
  switch (b.id){
    case "close": if (UI.view === "basics" && UI.basicsFrom === "recipe"){ UI.basicsFrom = null; renderRecipe(); document.getElementById("sheet").scrollTop = 0; break; }
      if (UI.view === "recipe" && UI.pick){ renderPicker(); document.getElementById("sheet").scrollTop = 0; } else { UI.pick = null; closeSheet(); render(); } break;
    case "homecheck": openHome(); break;
    case "sendfb": sendFeedback(); break;
    case "hidenudge": S.fbHide = true; save(); render(); toast("Feedback geven kan altijd bij Profiel, onder Hulp"); break;
    case "shopdone": if (!UI.doneArm){ UI.doneArm = true; render(); setTimeout(() => { if (UI.doneArm){ UI.doneArm = false; render(); } }, 4000); }
      else { UI.doneArm = false; const left = shopDone(); save(); render(); window.scrollTo(0, 0); toast(left.length ? "Opgeslagen. Over voor volgende keer: " + left.slice(0, 3).join(", ") : "Opgeslagen. Je lijst is weer leeg afgevinkt."); } break;
    case "autofill": { const n = autofill(); UI.insp = null; save(); render(); toast(n ? "Voorstellen toegevoegd. Pas ze gerust aan." : "Je week is al gevuld"); break; }
    case "clearplan": if (!UI.clearArm){ UI.clearArm = true; render(); setTimeout(() => { if (UI.clearArm){ UI.clearArm = false; render(); } }, 4000); }
      else { UI.clearArm = false; S.plan = { lunch: [], diner: [], ontbijt: [] }; S.checks = {}; UI.insp = null; save(); render(); toast("Je week is leeg. Kies nieuwe gerechten."); } break;
    case "newinsp": UI.insp = null; render(); break;
    case "opentracker": openTracker(); break;
    case "trackeron": S.tracker = true; save(); render(); toast("Eettracker staat aan. Uitzetten kan bij Profiel."); break;
    case "editprofile": openProfile(); break;
    case "saveprofile": saveProfile(); break;
    case "cancelprofile": closeSheet(); break;
    case "skipprofile": S.onboarded = true; save(); closeSheet(); toast("Je kunt je gegevens later invullen bij Profiel"); break;
    case "startcook": startCook(); document.getElementById("sheet").scrollTop = 0; break;
    case "endcook": UI.cook = null; stopTimer(); releaseWake(); renderRecipe(); break;
    case "prev": if (UI.cook > 0){ UI.cook--; renderCook(); } break;
    case "next": { const r = RID[UI.open]; const n = allSteps(r, factorFor(r)).length;
      if (UI.cook < n - 1){ UI.cook++; renderCook(); } else { UI.cook = null; stopTimer(); releaseWake(); UI.rating = {}; UI.photo = null; renderRating(); document.getElementById("sheet").scrollTop = 0; toast("Goed gedaan! Eet smakelijk."); } break; }
    case "delphoto": UI.photo = null; renderRating(); break;
    case "made": UI.rating = {}; UI.photo = null; renderRating(); document.getElementById("sheet").scrollTop = 0; break;
    case "cancelrate": renderRecipe(); break;
    case "saverate": {
      if (!Object.keys(UI.rating).length){ toast("Geef eerst minstens één onderdeel sterren"); break; }
      const dd = new Date().toISOString().slice(0, 10), rid = UI.open, sc = UI.rating, ph = UI.photo;
      (S.ratings[rid] = S.ratings[rid] || []).push({ d: dd, s: sc });
      save();
      if (ph){ saveLocalPhoto(rid, ph); cloudSavePhoto(rid, ph, dd); }
      cloudSaveRating(rid, sc, dd);
      UI.photo = null; loadPhotos(rid); renderRecipe(); document.getElementById("sheet").scrollTop = 0;
      toast(blocked(UI.open) ? "Opgeslagen. Dit gerecht wordt niet meer voorgesteld." : "Opgeslagen. Bedankt!"); break; }
    case "showall": S.showAll = !S.showAll; save(); render(); break;
    case "resetprefs": S.prefs = defaultPrefs(); save(); render(); toast("Voorkeuren teruggezet"); break;
    case "tgo": toggleTimer(); break;
    case "treset": stopTimer(); renderCook(); break;
    case "tstop": stopTimer(); renderCook(); break;
    case "copy": copyText(listAsText()); break;
    case "share": { const text = listAsText();
      if (navigator.share) navigator.share({ title: "Boodschappen", text }).catch(() => {});
      else copyText(text); break; }
    case "uncheck": S.checks = {}; save(); render(); break;
  }
});
document.addEventListener("submit", (e) => {
  if (e.target.id === "customfood"){
    e.preventDefault();
    const n = document.getElementById("cf-n").value.trim().slice(0, 60), k = parseInt(document.getElementById("cf-k").value, 10), p = parseInt(document.getElementById("cf-p").value, 10) || 0;
    if (!n || isNaN(k)){ toast("Vul in wat je gegeten hebt en de calorieën"); return; }
    addLog({ n, k, p, v: 0, src: "los" });
    if (document.getElementById("cf-save").checked){ S.myFoods = S.myFoods || []; if (!S.myFoods.some(x => x[0] === n)) S.myFoods.unshift([n, k, p, 0]); save(); }
    renderTracker(); toast(n + " toegevoegd"); return;
  }
  if (e.target.id === "wform"){
    e.preventDefault();
    const v = parseFloat(document.getElementById("wkg").value.replace(",", "."));
    if (isNaN(v) || v < 35 || v > 250){ toast("Vul je gewicht in kilo in, bijvoorbeeld 94,6"); return; }
    saveWeight(Math.round(v * 10) / 10); render(); toast(S.profile ? "Opgeslagen. Je dagdoelen zijn bijgewerkt." : "Opgeslagen"); return;
  }
  if (e.target.id !== "addform") return; e.preventDefault();
  const v = document.getElementById("addinput").value.trim(); if (!v) return;
  S.extras.push(v.slice(0, 80)); save(); render(); document.getElementById("addinput").focus();
});
document.addEventListener("change", async (e) => {
  if (e.target.id === "photoin" && e.target.files[0]){
    try { UI.photo = await shrinkPhoto(e.target.files[0]); renderRating(); } catch(err){ toast("Deze foto kan ik niet openen. Probeer een andere."); }
    return;
  }
  if (e.target.id === "sort"){ S.sort = e.target.value; save(); UI.filtersOpen = true; render(); }
  if (e.target.id === "trackertoggle"){ S.tracker = e.target.checked; save(); render(); toast(S.tracker ? "Eettracker staat aan" : "Eettracker staat uit"); }
  if (e.target.id === "focusfilter"){ S.focusFilter = e.target.checked; save(); render(); }

});
document.addEventListener("toggle", (e) => { if (e.target.id === "filters") UI.filtersOpen = e.target.open; if (e.target.id === "storesfold") UI.storesOpen = e.target.open; if (e.target.id === "extfold") UI.extOpen = e.target.open; }, true);
document.addEventListener("input", (e) => {
  if (e.target.id === "fbtext"){ UI.fb.text = e.target.value; return; }
  if (e.target.id === "psearch"){ UI.pq = e.target.value; UI.pmax = 50; document.getElementById("plist").innerHTML = pickerList(); return; }
  if (e.target.id === "search"){ UI.q = e.target.value; UI.rmax = 40; document.getElementById("rlist").innerHTML = recipeListHtml(); document.getElementById("rmore").innerHTML = moreBtn(recipeMatches().list.length, 40, "data-rmore"); return; }
  if (e.target.id === "tsearch"){ UI.tq = e.target.value; const q = UI.tq.toLowerCase();
    const row = (x, i, src) => `<button class="frow" data-addfood="${src}:${i}"><span>${esc(x[0])}</span><span class="num sub">${x[1]} kcal · ${x[2]} g eiwit</span><b class="plus">+</b></button>`;
    document.getElementById("tresults").innerHTML = trackerResults((S.myFoods || []).filter(x => x[0].toLowerCase().includes(q)), QUICK.filter(x => x[0].toLowerCase().includes(q)), row); return; }
  if (!e.target.classList.contains("pfin") || !UI.pfd) return;
  const key = e.target.id.slice(3), v = parseFloat(e.target.value.replace(",", "."));
  UI.pfd[key] = isNaN(v) ? null : v;
});
document.addEventListener("pointerdown", weightHover);
document.addEventListener("pointermove", (e) => { if (e.pointerType === "mouse" || e.buttons) weightHover(e); });
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && UI.cook !== null) keepAwake(); });
render();
if (!S.onboarded && !S.profile) openProfile();
initCloud();
</script>
